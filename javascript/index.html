<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>A* Maze Solver</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <header>
        <h1>A* Maze Solver</h1>
        <p>A maze carved with recursive backtracking, then solved with A* search.</p>
      </header>

      <div class="controls">
        <button id="new-maze" type="button">New maze</button>
        <label for="speed">Speed</label>
        <input id="speed" type="range" min="1" max="40" value="6" />
      </div>

      <canvas id="maze" width="640" height="640" aria-label="A* maze solver visualisation"></canvas>

      <ul class="legend">
        <li><span class="swatch swatch--start"></span>Start</li>
        <li><span class="swatch swatch--goal"></span>Goal</li>
        <li><span class="swatch swatch--seen"></span>Explored</li>
        <li><span class="swatch swatch--path"></span>Shortest path</li>
      </ul>
    </main>

    <script type="module" src="src/main.js"></script>
  </body>
</html>
